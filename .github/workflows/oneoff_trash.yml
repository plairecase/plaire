# Разовая задача (26.11.2026, с разрешения владельца): убрать Plaire_Editor.ipynb
# из папки Videos в корзину Google Диска (восстановимо 30 дней). После запуска файл workflow удаляется.
name: Разово — убрать ipynb в корзину

on:
  workflow_dispatch:

concurrency:
  group: plaire-autoedit
  cancel-in-progress: false

jobs:
  trash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Подключить Google Диск
        env:
          GDRIVE_ROOT_ID: ${{ secrets.GDRIVE_ROOT_ID }}
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
        run: bash scripts/setup_rclone.sh
      - name: В корзину
        run: |
          rclone lsf "gdrive:Videos" --include "Plaire_Editor.ipynb"
          rclone deletefile --drive-use-trash=true "gdrive:Videos/Plaire_Editor.ipynb"
          echo "Осталось в Videos:"; rclone lsf "gdrive:Videos" | grep -v -i -E '\.(mov|mp4)$' || echo "(только видео)"
